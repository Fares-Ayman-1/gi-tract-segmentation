[project]
name = "gisseg"
version = "0.1.0"
description = "2.5D U-Net segmentation of stomach, small and large bowel on MRI (UW-Madison GI Tract): RLE pipeline, competition metric (Dice + 3D Hausdorff), mixed-precision training, ONNX serving, viewer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Fares Ayman" }]
# Core = what the segmentation API needs at serving time (ONNX Runtime, no PyTorch).
dependencies = [
    "numpy>=2.0",
    "pillow>=11",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
train = [
    "torch>=2.5",
    "torchvision>=0.20",  # pinned to the same index as torch: a mismatched build breaks torchvision ops
    "segmentation-models-pytorch>=0.3.4",
    "albumentations>=1.4",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "mlflow>=3.0",
    "onnx>=1.17",
]
dashboard = ["streamlit>=1.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "kaggle>=1.6",
    "truststore>=0.10",
]

# CUDA build on the Windows training machine, small CPU build on Linux (CI)
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gisseg"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
ignore = ["PD010", "PD011", "PD101", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=gisseg --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
