name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (CPU PyTorch on Linux, see tool.uv.sources)
        run: uv sync --frozen --extra train --extra dashboard
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (synthetic 16-bit scans + RLE masks; 1-epoch CPU training; ONNX API)
        run: uv run pytest
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gisseg:ci .
